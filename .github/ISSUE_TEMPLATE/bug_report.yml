name: Bug Report
description: Create a report to help us improve EV Grid Oracle
title: "[BUG] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Which component is affected?
      options:
        - Frontend (Web)
        - Backend (Server)
        - Oracle / Model
        - Infrastructure / CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Any other context?
      description: Include any relevant logs, screenshots, or system information.
    validations:
      required: false
