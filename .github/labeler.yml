python:
  - any-glob-to-any-file:
      - '**/*.py'
      - 'pyproject.toml'
      - 'requirements.txt'

frontend:
  - any-glob-to-any-file:
      - 'web/**/*'

github_actions:
  - any-glob-to-any-file:
      - '.github/workflows/*'

documentation:
  - any-glob-to-any-file:
      - '**/*.md'
      - 'docs/**/*'
