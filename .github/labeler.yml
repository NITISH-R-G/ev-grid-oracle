backend:
  - any:
    - changed-files:
      - any-glob-to-any-file:
        - server/**/*
        - tools/**/*
        - tests/**/*
        - ev_grid_oracle/**/*
        - pyproject.toml

frontend:
  - any:
    - changed-files:
      - any-glob-to-any-file:
        - web/**/*

workflows:
  - any:
    - changed-files:
      - any-glob-to-any-file:
        - .github/workflows/**/*

documentation:
  - any:
    - changed-files:
      - any-glob-to-any-file:
        - docs/**/*
        - "**/*.md"
