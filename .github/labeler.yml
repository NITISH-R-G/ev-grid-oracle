frontend:
  - changed-files:
    - any-glob-to-any-file: ['web/**/*']

backend:
  - changed-files:
    - any-glob-to-any-file: ['server/**/*', 'ev_grid_oracle/**/*']

training:
  - changed-files:
    - any-glob-to-any-file: ['training/**/*']

docs:
  - changed-files:
    - any-glob-to-any-file: ['docs/**/*', 'README.md', 'CONTRIBUTING.md', 'CODE_OF_CONDUCT.md']

ci:
  - changed-files:
    - any-glob-to-any-file: ['.github/**/*']

tests:
  - changed-files:
    - any-glob-to-any-file: ['tests/**/*']
