name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install uv
      run: pip install uv

    - name: Pull Git LFS objects
      run: git lfs pull

    - name: Install python dependencies
      run: |
        uv sync --all-extras

    - name: Test backend with pytest
      run: uv run pytest tests/

    - name: Verify frontend build
      run: |
        cd web
        npm ci
        npm run build
