name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev,demo]"

    - name: Run Pytest
      run: |
        uv run pytest tests/ -q --tb=line

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ./web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type check and format
      run: |
        npx tsc --noEmit
        npx prettier --check .

    - name: Build
      run: npm run build
