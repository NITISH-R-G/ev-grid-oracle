name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev,demo]"

    - name: Build local test graph to prevent gzip read errors on missing LFS assets
      run: |
        python tools/build_road_graph.py

    - name: Run Pytest
      run: |
        uv run pytest tests/ -q --tb=line

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ./web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Verify build
      run: npm run build
