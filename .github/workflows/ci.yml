name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | bash
      - name: Install dependencies
        run: /home/runner/.local/bin/uv pip install --system -e ".[dev,demo]"
      - name: Run tests
        run: /home/runner/.local/bin/uv run pytest tests/