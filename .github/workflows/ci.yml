name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y git-lfs xdg-utils
          git lfs install
          uv pip install --system -e ".[dev,demo]"
      - name: Run Tests
        run: uv run pytest tests/
