name: Repository Maintenance

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  maintenance:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev,demo]"
          uv pip install --system cyclonedx-py

      - name: Generate SBOM
        run: |
          cyclonedx-py environment -o bom.json

      - name: Sync Documentation
        run: |
          python tools/docs_sync.py

      - name: Generate Architecture Graph
        run: |
          python tools/generate_architecture_diagrams.py

      - name: Generate Knowledge Graph
        run: |
          python tools/generate_knowledge_graph.py

      - name: Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/ docs/api/ || true
          git add bom.json || true
          git commit -m "chore: autonomous repository maintenance (docs, graphs, sbom)" || true
          git push || true
