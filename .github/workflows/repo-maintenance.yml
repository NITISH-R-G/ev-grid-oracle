name: Autonomous Repo Maintenance

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref }}
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pydeps cyclonedx-bom

    - name: Auto-fix formatting and linting
      run: |
        ruff check . --fix || true
        ruff format . || true

    - name: Sync Documentation
      run: |
        python tools/docs_sync.py

    - name: Generate Knowledge Graph
      run: |
        python tools/generate_knowledge_graph.py

    - name: Generate Architecture Diagrams
      run: |
        mkdir -p docs/architecture
        pydeps ev_grid_oracle --output docs/architecture/ev_grid_oracle.svg --no-show || true
        pydeps server --output docs/architecture/server.svg --no-show || true

    - name: Generate SBOM
      run: |
        cyclonedx-py environment -o bom.json

    - name: Commit changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "chore: autonomous repository maintenance [skip ci]" || echo "No changes to commit"
        git push
