name: Autonomous Repository Maintenance

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * *' # Daily

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff cyclonedx-bom

      - name: Run Ruff Autofix and Format
        run: |
          ruff check --fix .
          ruff format .
        continue-on-error: true

      - name: Generate SBOM
        run: |
          cyclonedx-py environment -o bom.json
        continue-on-error: true

      - name: Run Autonomous Generation Scripts
        run: |
          python tools/generate_knowledge_graph.py
          python tools/docs_sync.py
          python tools/generate_architecture_diagrams.py
        continue-on-error: true

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: autonomous repository maintenance [skip ci]"
            git push
          fi
