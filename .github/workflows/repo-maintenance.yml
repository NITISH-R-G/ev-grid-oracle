name: Repository Maintenance
on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * *' # Daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,demo]"

      - name: Generate Knowledge Graph
        run: python tools/generate_knowledge_graph.py || true

      - name: Sync Docs
        run: python tools/docs_sync.py || true

      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom cyclonedx-py
          cyclonedx-py environment -o bom.json || true

      - name: Run Prettier
        run: |
          npm install -g prettier
          prettier --write "**/*.{json,md,yaml,yml}" || true

      - name: Run Ruff Auto-fix
        run: |
          uv run --with ruff ruff check --fix . || true
          uv run --with ruff ruff format . || true

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): autonomous repository maintenance" && git push)
