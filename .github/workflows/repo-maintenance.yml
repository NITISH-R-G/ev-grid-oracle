name: Repo Maintenance

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  maintenance:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,demo]"

      - name: Run Ruff Lint and Format
        run: |
          uv run --with ruff ruff check --fix .
          uv run --with ruff ruff format .

      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o bom.json

      - name: Run Autonomous Tools
        run: |
          uv run python tools/generate_knowledge_graph.py
          uv run python tools/docs_sync.py
          uv run python tools/generate_architecture_diagrams.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/ docs/api/ || true
          git add .
          git commit -m "Auto-maintenance: Format, Docs, SBOM, Architecture & Knowledge Graph" || echo "No changes to commit"
          git push
