name: Autonomous Repository Maintenance

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev,demo]"
          uv pip install --system cyclonedx-bom cyclonedx-py pydeps networkx

      - name: Install system dependencies for pydeps
        run: sudo apt-get update && sudo apt-get install -y xdg-utils graphviz

      - name: Generate Knowledge Graph
        run: python tools/generate_knowledge_graph.py || true

      - name: Sync Documentation
        run: python tools/docs_sync.py || true

      - name: Generate Architecture Diagrams
        run: pydeps ev_grid_oracle --max-bacon=2 -o docs/architecture.svg || true

      - name: Generate SBOM
        run: cyclonedx-py environment -o bom.json || true

      - name: Auto-Fix Python Code
        run: |
          uv run --with ruff ruff check --fix . || true
          uv run --with ruff ruff format . || true

      - name: Auto-Fix Frontend Code
        working-directory: ./web
        run: |
          npm ci
          npx prettier --write . || true

      - name: Commit and Push Changes
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): autonomous repository maintenance" && git push)
