name: Repository Maintenance Automation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev,demo]"
          uv pip install --system pydeps cyclonedx-py

      - name: Auto-fix formatting and linting
        run: |
          uv run --with ruff ruff check --fix . || true
          uv run --with ruff ruff format . || true

      - name: Generate Architecture Diagrams
        run: |
          sudo apt-get update && sudo apt-get install -y xdg-utils graphviz
          mkdir -p artifacts
          pydeps ev_grid_oracle --output artifacts/architecture_diagram.svg --no-show || true

      - name: Generate SBOM
        run: |
          mkdir -p artifacts
          cyclonedx-py environment -o artifacts/bom.json

      - name: Generate Knowledge Graph
        run: |
          python tools/generate_knowledge_graph.py || true

      - name: Synchronize Documentation
        run: |
          python tools/docs_sync.py || true

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "chore(auto): repo maintenance (autofix, docs, diagrams, sbom) [skip ci]" || echo "No changes to commit"
          git push