name: Repository Maintenance

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev,demo]"
          pip install cyclonedx-bom

      - name: Run Documentation Sync
        run: |
          python tools/docs_sync.py

      - name: Run Knowledge Graph Generation
        run: |
          python tools/generate_knowledge_graph.py

      - name: Generate SBOM
        run: |
          mkdir -p artifacts
          cyclonedx-py environment -o artifacts/bom.json

      - name: Auto-fix with Ruff
        run: |
          ruff check --fix .
          ruff format .

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/ artifacts/ .
          git commit -m "chore(auto): repo maintenance (docs, knowledge graph, sbom, fixes)" || echo "No changes to commit"
          git push
