name: Repo Maintenance

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev,demo]"
          npm install -g prettier
          pip install cyclonedx-bom

      - name: Autofix Python formatting and linting
        run: |
          ruff check . --fix || true
          ruff format . || true

      - name: Autofix Frontend/Markdown formatting
        run: |
          prettier --write "**/*.{js,ts,jsx,tsx,css,md,json,yaml,yml}" || true

      - name: Generate Documentation (Docs Sync)
        run: |
          python tools/docs_sync.py

      - name: Generate Knowledge Graph
        run: |
          python tools/generate_knowledge_graph.py

      - name: Generate Architecture Diagrams
        run: |
          python tools/generate_architecture_diagrams.py

      - name: Generate SBOM
        run: |
          cyclonedx-py environment -o bom.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/ docs/api/ || true
          git add bom.json || true
          git commit -a -m "chore: automated repo maintenance (formatting, docs, graphs, sbom)" || echo "No changes to commit"
          git push
