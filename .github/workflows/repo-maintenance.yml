name: Autonomous Repo Maintenance

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0' # Weekly

permissions:
  contents: write

jobs:
  maintenance:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pydeps cyclonedx-bom cyclonedx-py uv
        sudo apt-get update && sudo apt-get install -y xdg-utils graphviz

    - name: Run Ruff Autofix & Format
      run: |
        ruff check --fix .
        ruff format .

    - name: Generate Knowledge Graph
      run: |
        python tools/generate_knowledge_graph.py

    - name: Sync Documentation
      run: |
        python tools/docs_sync.py

    - name: Generate SBOM
      run: |
        cyclonedx-py environment -o bom.json || echo "Failed to generate SBOM, skipping"

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "chore: autonomous repository maintenance [skip ci]" || echo "No changes to commit"
        git push
