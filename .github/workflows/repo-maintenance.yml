name: Repository Maintenance

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # Daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev,demo]" cyclonedx-bom

      - name: Auto-fix formatting (Ruff)
        run: |
          uv run --with ruff ruff check --fix .
          uv run --with ruff ruff format .

      - name: Generate API Documentation
        run: |
          python tools/docs_sync.py

      - name: Generate Knowledge Graph
        run: |
          python tools/generate_knowledge_graph.py

      - name: Generate Architecture Diagrams
        run: |
          python tools/generate_architecture_diagrams.py

      - name: Generate SBOM
        run: |
          cyclonedx-py environment -o bom.json

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f artifacts/ docs/api/ bom.json || true
          git commit -a -m "chore(auto): apply formatting, generate docs, knowledge graph, arch diagrams, and SBOM" || true
          git push
