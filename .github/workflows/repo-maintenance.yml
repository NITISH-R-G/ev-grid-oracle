name: Repository Maintenance Automation

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * *' # Daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Setup environment
        run: uv pip install --system -e ".[dev]" cyclonedx-bom

      - name: Run Ruff Autofix & Format
        run: |
          uv run --with ruff ruff check --fix .
          uv run --with ruff ruff format .

      - name: Generate Knowledge Graph
        run: uv run python tools/generate_knowledge_graph.py

      - name: Generate Documentation
        run: uv run python tools/docs_sync.py

      - name: Generate Architecture Diagrams
        run: uv run python tools/generate_architecture_diagrams.py

      - name: Generate SBOM
        run: cyclonedx-py environment -o bom.json

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): update repository artifacts and formatting" && git push)
