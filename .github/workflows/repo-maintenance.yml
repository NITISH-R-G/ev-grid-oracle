name: Autonomous Repository Maintenance

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-maintenance:
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cyclonedx-bom ruff

    - name: Run Ruff Auto-fixes
      run: |
        ruff check --unsafe-fixes --fix . || true
        ruff format . || true

    - name: Generate Knowledge Graph
      run: |
        python tools/generate_knowledge_graph.py || true

    - name: Generate Architecture Diagrams
      run: |
        python tools/generate_architecture_diagrams.py || true

    - name: Sync Documentation
      run: |
        python tools/docs_sync.py || true

    - name: Generate SBOM
      run: |
        cyclonedx-py environment -o bom.json || true

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -f artifacts/ docs/api/ bom.json || true
        git commit -am "chore(auto): autonomous repository maintenance updates" || true
        git push || true
