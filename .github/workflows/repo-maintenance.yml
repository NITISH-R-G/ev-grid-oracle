name: Autonomous Repository Maintenance

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *' # Daily at 4 AM

permissions:
  contents: write

jobs:
  maintenance:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev,demo]" cyclonedx-bom

      - name: Generate Knowledge Graph
        run: |
          python tools/generate_knowledge_graph.py

      - name: Sync Documentation
        run: |
          python tools/docs_sync.py

      - name: Run Ruff autofix and format
        run: |
          uv run --with ruff ruff check --fix .
          uv run --with ruff ruff format .

      - name: Generate SBOM
        run: |
          cyclonedx-py environment -o bom.json

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: autonomous repository maintenance [skip ci]" && git push)
