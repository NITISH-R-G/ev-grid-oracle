name: Repository Maintenance
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Daily

permissions:
  contents: write

jobs:
  maintain:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev,demo]"
          uv pip install --system pydeps cyclonedx-bom

      - name: Install xdg-utils
        run: sudo apt-get update && sudo apt-get install -y xdg-utils graphviz

      - name: Autofix Python code
        run: |
          uv run --with ruff ruff check --fix .
          uv run --with ruff ruff format .

      - name: Generate Knowledge Graph
        run: |
          python tools/generate_knowledge_graph.py

      - name: Sync Documentation
        run: |
          python tools/docs_sync.py

      - name: Generate SBOM
        run: |
          cyclonedx-py environment -o sbom.json

      - name: Generate Architecture Diagram
        run: |
          mkdir -p docs/architecture
          pydeps ev_grid_oracle --max-bacon 2 -o docs/architecture/ev_grid_oracle_deps.svg
          pydeps server --max-bacon 2 -o docs/architecture/server_deps.svg
          pydeps tools --max-bacon 2 -o docs/architecture/tools_deps.svg

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: autonomous repository maintenance (autofix, docs, graph, sbom, architecture)"
          branch: ${{ github.head_ref || github.ref_name }}
          file_pattern: 'docs/ sbom.json knowledge_graph.json *.py **/*.py'
