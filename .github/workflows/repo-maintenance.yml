name: Repo Maintenance

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xdg-utils graphviz

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e ".[dev,demo]"
          pip install ruff pydeps cyclonedx-py

      - name: Autofix Code (Ruff)
        run: |
          ruff check --fix . || true
          ruff format . || true

      - name: Generate Knowledge Graph
        run: |
          python tools/generate_knowledge_graph.py

      - name: Sync Documentation
        run: |
          python tools/docs_sync.py

      - name: Generate Architecture Diagrams
        run: |
          mkdir -p docs/architecture
          pydeps ev_grid_oracle -o docs/architecture/ev_grid_oracle_deps.svg || true

      - name: Generate SBOM
        run: |
          cyclonedx-py environment -o bom.json

      - name: Commit Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: autonomous repository maintenance" || echo "No changes to commit"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
