name: Repository Maintenance

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * *' # Daily

permissions:
  contents: write

jobs:
  maintenance:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install uv
        uv pip install --system -e ".[dev,demo]"
        pip install ruff cyclonedx-bom

    - name: Autofix Ruff formatting
      run: |
        ruff format .
        ruff check --fix . || true

    - name: Run Docs Sync
      run: python tools/docs_sync.py

    - name: Generate Knowledge Graph
      run: python tools/generate_knowledge_graph.py

    - name: Generate Architecture Diagrams
      run: python tools/generate_architecture_diagrams.py

    - name: Generate SBOM
      run: cyclonedx-py environment -o bom.json

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -f artifacts/ docs/api/ || true
        git add .
        if ! git diff-index --quiet HEAD; then
          git commit -m "chore: autonomous repository maintenance [skip ci]"
          git push
        fi
