name: Repository Maintenance Automation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM UTC

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Pull Git LFS objects
        run: git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system -e ".[dev,demo]"
          uv pip install --system ruff==0.15.5 pydeps cyclonedx-bom

      - name: Run Ruff Autofix
        run: |
          ruff check . --fix
          ruff format .

      - name: Generate Architecture Diagrams
        run: |
          sudo apt-get update && sudo apt-get install -y xdg-utils graphviz
          mkdir -p docs/architecture
          pydeps ev_grid_oracle --output docs/architecture/ev_grid_oracle_deps.svg
          pydeps server --output docs/architecture/server_deps.svg

      - name: Generate Knowledge Graph
        run: |
          python tools/generate_knowledge_graph.py

      - name: Sync Documentation
        run: |
          python tools/docs_sync.py

      - name: Generate SBOM
        run: |
          mkdir -p artifacts
          cyclonedx-py environment -o artifacts/bom.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "chore: automated repository maintenance [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
