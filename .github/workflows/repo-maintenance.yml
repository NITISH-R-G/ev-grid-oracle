name: Repository Maintenance and Self-Healing

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM UTC

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv cyclonedx-bom ruff mypy
          uv pip install --system -e ".[dev,demo]"

      - name: Autofix Code (Ruff)
        run: |
          ruff check --fix . || true
          ruff format . || true

      - name: Run Architecture Diagrams Sync
        run: |
          python tools/generate_architecture_diagrams.py || true

      - name: Run Knowledge Graph Gen
        run: |
          python tools/generate_knowledge_graph.py || true

      - name: Run Documentation Sync
        run: |
          python tools/docs_sync.py || true

      - name: Generate SBOM
        run: |
          mkdir -p artifacts
          cyclonedx-py environment -o artifacts/bom.json || true

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f artifacts/ docs/api/ || true
          git add .
          git commit -m "chore(auto): apply autonomous self-healing and artifacts generation" || echo "No changes to commit"
          git push
