name: Repository Maintenance Automation

on:
  push:
    branches: ["main", "master"]
  schedule:
    - cron: "0 2 * * *" # Daily at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install --system ruff cyclonedx-bom

      - name: Install Prettier
        run: npm install -g prettier

      - name: Auto-fix linting issues with Ruff
        run: |
          ruff check --unsafe-fixes --fix . || true
          ruff format . || true

      - name: Format other files with Prettier
        run: |
          prettier --write "**/*.{json,md,yaml,yml,js,ts}" || true

      - name: Generate Knowledge Graph
        run: |
          python tools/generate_knowledge_graph.py || true

      - name: Generate Architecture Diagrams
        run: |
          python tools/generate_architecture_diagrams.py || true

      - name: Sync API Documentation
        run: |
          python tools/docs_sync.py || true

      - name: Generate SBOM
        run: |
          mkdir -p artifacts
          cyclonedx-py environment -o artifacts/bom.json || true

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/ docs/api/ || true
          git add .
          git diff --staged --quiet || git commit -m "chore(auto): repo maintenance and self-healing [skip ci]"
          git push
