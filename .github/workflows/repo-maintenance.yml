name: Repo Maintenance
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

permissions:
  contents: write

jobs:
  repo-maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev,demo]"
          uv pip install --system cyclonedx-bom

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./web/package-lock.json

      - name: Install Prettier globally
        run: npm install -g prettier

      - name: Autofix Python Code
        run: |
          uv run --with ruff ruff check --fix .
          uv run --with ruff ruff format .

      - name: Sync Documentation
        run: python tools/docs_sync.py

      - name: Generate Knowledge Graph
        run: python tools/generate_knowledge_graph.py

      - name: Generate Architecture Diagrams
        run: python tools/generate_architecture_diagrams.py

      - name: Generate SBOM
        run: cyclonedx-py environment -o bom.json

      - name: Format Non-Python Files
        run: prettier --write "**/*.{json,md,yml,yaml}" --ignore-path .prettierignore

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated repository maintenance [skip ci]" && git push)
