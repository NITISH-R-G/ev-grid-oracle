name: Repository Maintenance

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system ruff cyclonedx-bom cyclonedx-py
          # Ensure tools dependencies are met if any
          uv pip install --system -e ".[dev,demo]"

      - name: Auto-format Code (Ruff)
        run: |
          ruff check --unsafe-fixes --fix . || true
          ruff format .

      - name: Generate Knowledge Graph
        run: python tools/generate_knowledge_graph.py

      - name: Sync Documentation
        run: python tools/docs_sync.py

      - name: Generate Architecture Diagrams
        run: python tools/generate_architecture_diagrams.py

      - name: Generate SBOM
        run: |
          mkdir -p artifacts
          cyclonedx-py environment -o artifacts/bom.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/ docs/api/ || true
          git commit -am "chore: autonomous repository maintenance (formatting, docs, graphs, sbom) [skip ci]" || echo "No changes to commit"
          git push
