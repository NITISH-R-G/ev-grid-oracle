name: Autonomous Repository Maintenance

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        # fetch-depth 0 is needed if we're generating PRs or pushing back
        fetch-depth: 0
        ref: ${{ github.head_ref || github.ref_name }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: |
        python -m pip install uv
        uv pip install --system -e ".[dev]" pdoc pylint pydeps cyclonedx-bom
        cd web
        npm ci || npm install
        npm install -g @cyclonedx/cyclonedx-npm
        cd ..
        sudo apt-get install -y graphviz

    - name: Format Python
      run: |
        uv run --with ruff ruff check --fix . || true
        uv run --with ruff ruff format . || true

    - name: Format Frontend
      run: |
        cd web
        npx prettier --write . || true
        cd ..

    - name: Generate API Docs
      run: |
        pdoc -o docs/api ev_grid_oracle server || true

    - name: Generate Diagrams
      run: |
        mkdir -p docs/architecture
        pyreverse -o png -p ev_grid_oracle ev_grid_oracle/ -d docs/architecture/ || true
        pyreverse -o png -p server server/ -d docs/architecture/ || true

    - name: Generate Dependency Graph
      run: |
        mkdir -p docs/knowledge-graph
        pydeps ev_grid_oracle --cluster -o docs/knowledge-graph/ev_grid_oracle.svg || true
        pydeps server --cluster -o docs/knowledge-graph/server.svg || true

    - name: Generate SBOM for Python
      run: cyclonedx-py environment --outfile bom-python.json || true

    - name: Generate SBOM for Node
      run: |
        cd web
        cyclonedx-npm --output-file ../bom-node.json || true
        cd ..

    - name: Create Pull Request or Commit
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore(maintenance): auto-fix, update docs, diagrams, and SBOM"
        title: "Autonomous Repository Maintenance"
        body: |
          This PR contains autonomous updates generated by the repository maintenance system.
          - Code formatting (Ruff, Prettier)
          - API documentation sync
          - Architecture diagram generation
          - Knowledge graph generation
          - SBOM generation
        branch: "auto-maintenance-updates"
        base: ${{ github.head_ref || github.ref_name }}
        labels: "automated pr"
