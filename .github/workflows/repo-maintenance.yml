name: Repository Maintenance
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev]" cyclonedx-bom ruff
          npm install -g prettier

      - name: Code Quality Automation
        run: |
          ruff format .
          ruff check . --fix
          prettier --write .

      - name: Update Documentation & Knowledge Graph
        run: |
          python tools/generate_knowledge_graph.py
          python tools/docs_sync.py

      - name: Generate SBOM
        run: cyclonedx-py environment -o bom.json

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: autonomous repository maintenance" || echo "No changes to commit"
          git push
