name: Autonomous Repo Maintenance

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * *' # Daily

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install uv
          uv pip install --system -e ".[dev,demo]" cyclonedx-bom

      - name: Generate Knowledge Graph
        run: python tools/generate_knowledge_graph.py

      - name: Generate Architecture Diagrams
        run: python tools/generate_architecture_diagrams.py

      - name: Generate API Docs
        run: python tools/docs_sync.py

      - name: Generate SBOM
        run: |
          mkdir -p artifacts
          cyclonedx-py environment -o artifacts/bom.json

      - name: Check for changes
        id: git-check
        run: |
          git add -f artifacts/ docs/api/ || true
          git diff --staged --quiet || echo "modified=true" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: steps.git-check.outputs.modified == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: autonomous repository maintenance [skip ci]"
          git push
