name: Repository Maintenance

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Pull Git LFS objects
        run: git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev,demo]"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: ./web
        run: npm ci

      - name: Format frontend files
        working-directory: ./web
        run: npx prettier --write .

      - name: Run Ruff autofix and format
        run: |
          ruff check --fix .
          ruff format .

      - name: Generate Knowledge Graph
        run: python tools/generate_knowledge_graph.py

      - name: Generate API Documentation
        run: python tools/docs_sync.py

      - name: Generate SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o bom.json

      - name: Generate Frontend SBOM
        working-directory: ./web
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file bom.json

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff-index --quiet HEAD || git commit -m "chore: automated repository maintenance [skip ci]"
          git push
