name: Repository Maintenance & Autonomous Generation
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev,demo]"
          uv pip install --system cyclonedx-bom cyclonedx-py pydeps
          sudo apt-get update && sudo apt-get install -y xdg-utils graphviz

      - name: Autofix Code (Ruff)
        run: |
          uv run --with ruff ruff check --fix .
          uv run --with ruff ruff format .

      - name: Generate Knowledge Graph
        run: python tools/generate_knowledge_graph.py

      - name: Sync API Documentation
        run: python tools/docs_sync.py

      - name: Generate SBOM
        run: cyclonedx-py environment -o bom.json

      - name: Generate Architecture Diagrams
        run: |
          mkdir -p docs/architecture
          pydeps ev_grid_oracle --noshow -o docs/architecture/ev_grid_oracle_deps.svg || true
          pydeps server --noshow -o docs/architecture/server_deps.svg || true

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate knowledge graph, docs, SBOM, architecture diagrams, and auto-fix code" && git push)
