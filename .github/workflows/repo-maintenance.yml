name: Repository Maintenance
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev]"
          uv pip install --system cyclonedx-bom

      - name: Auto-fix linting issues
        run: ruff check --unsafe-fixes --fix . || true

      - name: Generate SBOM
        run: |
          mkdir -p artifacts
          cyclonedx-py environment -o artifacts/bom.json || true

      - name: Generate Architecture Diagrams
        run: |
          mkdir -p artifacts
          python tools/generate_architecture_diagrams.py || true

      - name: Generate Knowledge Graph
        run: |
          mkdir -p artifacts
          python tools/generate_knowledge_graph.py || true

      - name: Sync Documentation
        run: |
          mkdir -p docs/api
          python tools/docs_sync.py || true

      - name: Format generated files
        run: ruff format . || true

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/ docs/api/ || true
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): repo maintenance and self-healing" && git push)
