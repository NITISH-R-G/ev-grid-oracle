name: Repository Maintenance

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev,demo]" cyclonedx-bom

      - name: Run code formatting
        run: |
          uv run --with ruff ruff check --fix .
          uv run --with ruff ruff format .

      - name: Update documentation
        run: |
          python tools/docs_sync.py

      - name: Generate knowledge graph
        run: |
          python tools/generate_knowledge_graph.py

      - name: Generate SBOM
        run: |
          cyclonedx-py environment -o bom.json

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated repository maintenance [skip ci]" && git push)
