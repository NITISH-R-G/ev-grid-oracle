name: Repository Maintenance Automation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM

permissions:
  contents: write

jobs:
  maintenance:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        lfs: true
        ref: ${{ github.head_ref || github.ref }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install uv
      run: pip install uv

    - name: Install tools
      run: |
        uv pip install --system ruff cyclonedx-bom

    - name: Run Autofix
      run: |
        uv run --with ruff ruff check --fix .
        uv run --with ruff ruff format .

    - name: Run Autonomous Docs Generation
      run: |
        python tools/docs_sync.py

    - name: Run Knowledge Graph Generation
      run: |
        python tools/generate_knowledge_graph.py

    - name: Run Architecture Diagrams Generation
      run: |
        python tools/generate_architecture_diagrams.py

    - name: Generate SBOM
      run: |
        mkdir -p artifacts
        cyclonedx-py environment -o artifacts/bom.json || echo "SBOM generation warning, ignoring"

    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add .
        git commit -m "chore(auto): update artifacts, docs, and formatting" || echo "No changes to commit"
        git push || echo "Push failed, likely due to no changes or permissions"
