name: Repository Maintenance Automation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM UTC

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -e ".[dev,demo]"
          uv pip install --system cyclonedx-bom

      - name: Auto-fix linting and formatting (Ruff)
        run: |
          uv run --with ruff ruff check --unsafe-fixes --fix .
          uv run --with ruff ruff format .

      - name: Generate SBOM
        run: |
          uv run cyclonedx-py environment -o bom.json

      - name: Generate Documentation (Docs Sync)
        run: |
          python tools/docs_sync.py

      - name: Generate Architecture Diagram
        run: |
          python tools/generate_architecture_diagrams.py

      - name: Generate Knowledge Graph
        run: |
          python tools/generate_knowledge_graph.py

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f artifacts/ docs/api/ || true
          git add .
          git commit -m "chore(auto): repo maintenance (autofix, docs, graphs, sbom)" || echo "No changes to commit"
          git push
