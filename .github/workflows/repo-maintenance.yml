name: Repository Maintenance & Autonomous Tools

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  maintenance:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref }}
        fetch-depth: 0
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv ruff networkx cyclonedx-bom cyclonedx-py pydeps
        sudo apt-get update && sudo apt-get install -y xdg-utils
        npm install -g prettier

    - name: Auto-format with Ruff and Prettier
      run: |
        ruff check --fix . || true
        ruff format . || true
        prettier --write "**/*.{json,md,yaml,yml}" "web/src/**/*.{ts,tsx}" || true

    - name: Run Docs Sync
      run: python tools/docs_sync.py || true

    - name: Run Knowledge Graph Generator
      run: python tools/generate_knowledge_graph.py || true

    - name: Generate SBOM
      run: cyclonedx-py environment -o bom.json || true

    - name: Generate Architecture Diagrams
      run: |
        mkdir -p docs/architecture
        pydeps server --noshow -o docs/architecture/server_deps.svg || true
        pydeps ev_grid_oracle --noshow -o docs/architecture/oracle_deps.svg || true
        pydeps training --noshow -o docs/architecture/training_deps.svg || true
        python tools/generate_health_dashboard.py || true

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        if ! git diff-index --quiet HEAD; then
          git commit -m "Auto-maintenance: Format, docs sync, diagrams, knowledge graph, SBOM"
          git push
        fi
