name: Autonomous Repository Maintenance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # Daily at midnight

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff cyclonedx-bom pre-commit

      - name: Code Quality Autofix (Ruff)
        run: ruff check --fix . || true

      - name: Generate Knowledge Graph
        run: python tools/generate_knowledge_graph.py || true

      - name: Sync Documentation
        run: python tools/docs_sync.py || true

      - name: Generate Architecture Diagrams
        run: python tools/generate_architecture_diagrams.py || true

      - name: Generate SBOM
        run: cyclonedx-py environment -o bom.json || true

      - name: Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/ docs/api/ bom.json || true
          git add .
          git commit -m "chore(auto): autonomous repository maintenance" || echo "No changes to commit"
          git push