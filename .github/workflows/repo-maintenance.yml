name: Autonomous Repo Maintenance

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y xdg-utils
          python -m pip install --upgrade pip
          pip install ruff cyclonedx-bom pydeps networkx typing-extensions pydantic pydantic-settings
          pip install -e ".[dev]" || true

      - name: Lint and Format with Ruff
        run: |
          ruff check . --fix || true
          ruff format . || true

      - name: Generate SBOM
        run: |
          cyclonedx-py environment -o bom.json || true

      - name: Generate Knowledge Graph
        run: |
          python tools/generate_knowledge_graph.py || true

      - name: Sync Docs (API Reference)
        run: |
          python tools/docs_sync.py || true

      - name: Generate Architecture Diagrams
        run: |
          mkdir -p docs/architecture
          # Exclude .venv and generate diagram
          pydeps ev_grid_oracle --exclude-sys --noshow -o docs/architecture/ev_grid_oracle_deps.svg || true
          pydeps server --exclude-sys --noshow -o docs/architecture/server_deps.svg || true

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore(auto): repo maintenance (format, docs, sbom, diagrams) [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"