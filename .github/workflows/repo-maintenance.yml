name: Repository Maintenance

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv and dependencies
        run: |
          python -m pip install uv
          uv pip install --system -e ".[dev,demo]" cyclonedx-bom pydeps

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: \'24\'

      - name: Install global prettier
        run: npm install -g prettier

      - name: Run Ruff Format and Check
        run: |
          uv run --with ruff ruff check --fix .
          uv run --with ruff ruff format .

      - name: Format frontend files
        run: |
          cd web
          npx prettier --write .
          cd ..
          prettier --write "**/*.{json,md,yml,yaml}" --ignore-path .prettierignore

      - name: Run Architecture Diagrams Generation
        run: |
          sudo apt-get update && sudo apt-get install -y xdg-utils
          mkdir -p docs/architecture
          pydeps ev_grid_oracle --noshow --output docs/architecture/ev_grid_oracle.svg || true
          pydeps server --noshow --output docs/architecture/server.svg || true

      - name: Run Documentation Sync
        run: |
          python tools/docs_sync.py

      - name: Run Knowledge Graph Generation
        run: |
          python tools/generate_knowledge_graph.py

      - name: Run SBOM Generation
        run: |
          cyclonedx-py environment -o bom.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: autonomous repository maintenance [skip ci]" || echo "No changes to commit"
          git push
