name: Autonomous Repository Maintenance

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev,demo]"
          uv pip install --system ruff cyclonedx-py

      - name: Run Ruff Autofix
        run: |
          ruff check --unsafe-fixes --fix . || true
          ruff format . || true

      - name: Sync Documentation
        run: python tools/docs_sync.py || true

      - name: Generate Knowledge Graph
        run: python tools/generate_knowledge_graph.py || true

      - name: Generate Architecture Diagrams
        run: python tools/generate_architecture_diagrams.py || true

      - name: Generate SBOM
        run: cyclonedx-py environment -o artifacts/bom.json || true

      - name: Commit Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add -f docs/api/ artifacts/ || true
          git add . || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: autonomous repository maintenance and regeneration" && git push)
