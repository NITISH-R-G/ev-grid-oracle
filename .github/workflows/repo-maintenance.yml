name: Repository Maintenance and Generation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * *' # Daily

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref }}
        lfs: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xdg-utils
        pip install uv
        uv pip install --system -e ".[dev,demo]"
        uv pip install --system pydeps cyclonedx-bom

    - name: Autofix Python formatting and linting
      run: |
        uv run --with ruff ruff check --fix . || true
        uv run --with ruff ruff format . || true

    - name: Generate Architecture Diagrams
      run: |
        mkdir -p docs/architecture
        pydeps ev_grid_oracle --output docs/architecture/dependency_graph.svg --noshow || true
        pydeps server --output docs/architecture/server_dependency_graph.svg --noshow || true

    - name: Run Documentation Sync
      run: |
        python tools/docs_sync.py

    - name: Run Knowledge Graph Generation
      run: |
        python tools/generate_knowledge_graph.py

    - name: Generate SBOM
      run: |
        cyclonedx-py environment -o bom.json

    - name: Commit and Push Changes
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add docs/ bom.json
        git add -u
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: autonomous repository maintenance (docs, sbom, fixes)" && git push)
