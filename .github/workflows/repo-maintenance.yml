name: Autonomous Repository Maintenance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM UTC

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    # Only run on pushes to main, scheduled events, or PRs from the same repository
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Check out the originating PR branch to avoid detached HEAD
          ref: ${{ github.head_ref || github.ref }}
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install -g prettier
          pip install uv cyclonedx-bom
          uv pip install --system -e ".[dev,demo]"

      - name: Run Auto-Format and Linting (Ruff & Prettier)
        run: |
          uv run --with ruff ruff check --fix .
          uv run --with ruff ruff format .
          prettier --write "**/*.{json,md,yaml,yml}" "web/**/*.{js,ts,jsx,tsx,json,md}"

      - name: Generate API Documentation
        run: |
          python tools/docs_sync.py

      - name: Generate Architecture Diagram
        run: |
          python tools/generate_architecture_diagrams.py

      - name: Generate Knowledge Graph
        run: |
          python tools/generate_knowledge_graph.py

      - name: Generate SBOM
        run: |
          cyclonedx-py environment -o artifacts/bom.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Force add artifacts and docs since they are likely in .gitignore
          git add -f artifacts/ docs/api/ || true
          git add .
          git commit -m "chore(auto): autonomous repository maintenance updates [skip ci]" || echo "No changes to commit"
          git push
