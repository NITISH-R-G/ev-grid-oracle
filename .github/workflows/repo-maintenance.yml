name: Repository Maintenance Automation

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev,demo]"
          pip install cyclonedx-bom

      - name: Generate Documentation Sync
        run: |
          python tools/docs_sync.py

      - name: Generate Knowledge Graph
        run: |
          python tools/generate_knowledge_graph.py

      - name: Generate Architecture Diagrams
        run: |
          python tools/generate_architecture_diagrams.py

      - name: Generate SBOM
        run: |
          cyclonedx-py environment -o artifacts/bom.json

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/ artifacts/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: Auto-generate docs, graphs, and SBOM" && git push)
