name: Repository Maintenance

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

permissions:
  contents: write

jobs:
  maintenance:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true
        ref: ${{ github.head_ref || github.ref }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev,demo]"
        uv pip install --system cyclonedx-bom

    - name: Run Ruff Format and Fix
      run: |
        uv run --with ruff ruff check --fix .
        uv run --with ruff ruff format .

    - name: Sync Documentation
      run: python tools/docs_sync.py

    - name: Generate Knowledge Graph
      run: python tools/generate_knowledge_graph.py

    - name: Generate Architecture Diagrams
      run: python tools/generate_architecture_diagrams.py

    - name: Generate SBOM
      run: cyclonedx-py environment -o bom.json

    - name: Commit changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated repository maintenance [skip ci]" && git push)
