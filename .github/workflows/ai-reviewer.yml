name: AI Code Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  coderabbit:
    runs-on: ubuntu-latest
    if: ${{ github.event.sender.type != 'Bot' }}
    steps:
      - name: CodeRabbit AI Code Review
        uses: coderabbitai/coderabbit-action@v1
        with:
          # This assumes users will install the CodeRabbit GitHub App.
          # We enable it as a helpful start.
          auto-review: "true"
