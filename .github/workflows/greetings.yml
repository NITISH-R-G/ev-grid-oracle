name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Welcome to the repository! 👋 \n\nThank you for opening your first issue here. Our automated triage system will label it shortly, and our AI maintainer will review it. If you have any questions, please feel free to ask!"
        pr-message: "Welcome and thank you for your first pull request! 🎉 \n\nOur AI maintainer will review your code shortly. Please make sure you have read our CONTRIBUTING.md. We appreciate your contribution!"
