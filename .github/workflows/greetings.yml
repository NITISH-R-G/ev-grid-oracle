name: Welcome Contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome and thank you for opening your first issue in this repository! We appreciate your contribution."
          pr-message: "Welcome and thank you for opening your first pull request! A project maintainer or AI agent will review it shortly."
