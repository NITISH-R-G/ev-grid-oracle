name: Greetings

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: 'Welcome to the project! Thank you for opening your first issue here. A maintainer will check it out shortly.'
          pr-message: 'Welcome to the project! Thank you for submitting your first pull request. The automated checks will run now, and a reviewer will be assigned.'
