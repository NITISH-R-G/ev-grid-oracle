name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: 'Welcome to EV Grid Oracle! Thank you for opening your first issue. We will triage it shortly.'
        pr-message: 'Welcome to EV Grid Oracle! Thank you for your first pull request. A maintainer or our AI reviewer will take a look soon.'
