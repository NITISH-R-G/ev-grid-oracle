name: Contributor Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: 'Welcome to the project! Thank you for opening your first issue. Our AI maintainer and community will review it shortly.'
          pr-message: 'Welcome to the project! Thank you for your first pull request. Our automated checks and AI reviewer will analyze your changes shortly.'
