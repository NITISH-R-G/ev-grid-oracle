name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Welcome to the EV Grid Oracle repository! :wave:\n\nThank you for opening your first issue. We appreciate your contribution to making this project better. A maintainer will review your issue shortly.\n\nIn the meantime, feel free to check out our [Contributing Guidelines](CONTRIBUTING.md)."
        pr-message: "Welcome to the EV Grid Oracle repository! :tada:\n\nThank you for opening your first pull request. We are excited to review your contribution.\n\nPlease ensure your PR follows our [Contributing Guidelines](CONTRIBUTING.md) and that all checks pass."
