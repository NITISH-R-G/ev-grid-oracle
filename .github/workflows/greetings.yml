name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: 'Welcome to the EV Grid Oracle repository! Thank you for opening your first issue. We will look into it as soon as possible.'
          pr-message: 'Welcome to the EV Grid Oracle repository! Thank you for your first pull request. The CI and AI Reviewer will take a look shortly.'
