name: Greetings

on: [pull_request, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: 'Welcome to EV Grid Oracle! Thank you for opening your first issue. We will review it shortly.'
        pr-message: 'Welcome to EV Grid Oracle! Thank you for your first pull request. Our autonomous systems will begin reviewing it.'
