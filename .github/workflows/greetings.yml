name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: 'Welcome to the EV Grid Oracle repository! Thank you for opening your first issue. Our autonomous systems and maintainers will review it shortly. If you have any questions, feel free to ask.'
          pr-message: 'Welcome to the EV Grid Oracle repository! Thank you for your first pull request. Our autonomous AI reviewers and CI/CD pipelines will check your code. Please make sure all tests pass.'
