name: Greetings

on: [pull_request, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Welcome to EV Grid Oracle! Thank you for opening your first issue. A maintainer will review it shortly. In the meantime, please ensure you've provided all necessary details according to our issue templates."
        pr-message: "Welcome to EV Grid Oracle! Thank you for your first pull request. We appreciate your contribution! Please ensure that you have run `./validate-submission.sh` locally and that all checks pass."
