name: Greetings
on: [pull_request, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome! Thank you for opening your first issue in EV Grid Oracle. We are excited to have you here."
          pr-message: "Welcome! Thank you for submitting your first PR to EV Grid Oracle! A maintainer will review your changes shortly."
