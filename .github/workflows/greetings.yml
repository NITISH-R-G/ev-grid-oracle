name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Welcome to the EV Grid Oracle project! Thank you for opening your first issue.
            We appreciate your contribution and our maintainers will look into this shortly.
            Please ensure your issue adheres to our [Code of Conduct](CODE_OF_CONDUCT.md).
          pr-message: |
            Welcome to the EV Grid Oracle project! Thank you for submitting your first Pull Request.
            We greatly appreciate your contribution!
            Before we can merge, please ensure that your PR passes all our CI checks and follows our [Contributing Guidelines](CONTRIBUTING.md).
            A maintainer will review your PR soon.
