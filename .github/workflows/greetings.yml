name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome to EV Grid Oracle! Thank you for opening your first issue. Our AI maintainer and community leaders will take a look shortly."
          pr-message: "Welcome to EV Grid Oracle! Thank you for your first pull request. We are excited to review your contributions."
