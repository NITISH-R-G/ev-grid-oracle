name: Greetings

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome to the repository! Thank you for opening your first issue. A maintainer will review it shortly."
          pr-message: "Welcome to the repository! Thank you for your first pull request. Please ensure you have followed the contribution guidelines and all tests pass."
