name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome to the repository! Thank you for opening your first issue. Our AI maintainer and human team will review it shortly."
          pr-message: "Welcome to the repository! Thank you for your first pull request. Our automated checks are running, and we will review your changes soon."
