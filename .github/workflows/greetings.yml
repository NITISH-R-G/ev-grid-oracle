name: Welcome New Contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Welcome to the EV Grid Oracle repository! 🎉

            Thank you for opening your first issue here. A maintainer will triage this shortly.
            In the meantime, feel free to check our [Contributing Guidelines](CONTRIBUTING.md) to understand how we work.
          pr-message: |
            Hello there! 🎉 Thank you for your first Pull Request!

            We are excited to review your contribution. Our AI assistant will provide an initial review shortly.
            Make sure you've read our [Contributing Guidelines](CONTRIBUTING.md).
