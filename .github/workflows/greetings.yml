name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome to the EV Grid Oracle repository! Thank you for opening your first issue. A maintainer will check it out shortly."
          pr-message: "Welcome to the EV Grid Oracle repository! Thank you for your first pull request. The AI maintainer and standard CI checks will run shortly to help get this merged."
