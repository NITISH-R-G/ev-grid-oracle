name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: 'Welcome to EV Grid Oracle! :wave: Thank you for opening your first issue here. A maintainer will triage this shortly. In the meantime, please ensure you have provided clear steps to reproduce if this is a bug report.'
        pr-message: 'Welcome to EV Grid Oracle! :wave: Thank you for your first pull request. We appreciate your contribution to making this an advanced, self-improving repository. Please ensure all CI checks pass and someone will review your changes shortly.'
