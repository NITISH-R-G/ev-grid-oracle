name: Greetings

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Welcome to the repository! Thank you for opening your first issue. Our AI maintainer will review it shortly. In the meantime, please ensure you've provided all necessary details."
        pr-message: "Welcome and thank you for your first pull request! We're excited to review your contribution. Our AI PR agent will automatically perform an initial review. Please ensure `./validate-submission.sh` passes locally."
