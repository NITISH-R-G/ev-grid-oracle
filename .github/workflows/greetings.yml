name: Greetings

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Welcome to the EV Grid Oracle repository! 👋

            Thank you for opening your first issue. A maintainer will triage this shortly.
            In the meantime, please ensure you've provided all necessary details and followed the issue template.

            Check out our [Contributing Guidelines](CONTRIBUTING.md) to see how you can help out.
          pr-message: |
            Welcome to the EV Grid Oracle repository and congratulations on your first pull request! 🎉

            We really appreciate your contribution. Our AI reviewer and CI checks will start running shortly.
            A maintainer will review your PR as soon as possible.

            Please ensure you have read our [Contributing Guidelines](CONTRIBUTING.md) and run `./validate-submission.sh` locally.
