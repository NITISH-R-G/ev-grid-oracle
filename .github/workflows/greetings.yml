name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Welcome to EV Grid Oracle! Thank you for opening your first issue. A maintainer will review it shortly. In the meantime, please check our contributing guidelines."
        pr-message: "Welcome to EV Grid Oracle! Thank you for your first pull request. Please ensure you have run the validation checks (`./validate-submission.sh`) locally."
