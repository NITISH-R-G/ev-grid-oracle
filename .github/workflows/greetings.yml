name: Greetings
on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome to the repository! Thank you for opening your first issue. A maintainer or our AI system will be with you shortly."
          pr-message: "Welcome to the repository! Thank you for opening your first pull request. Our CI and AI reviewer will take a look."
