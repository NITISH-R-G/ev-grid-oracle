name: Welcome First-Time Contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome to the repository! 👋 Thanks for opening your first issue here. A maintainer will triage this shortly."
          pr-message: "Welcome to the repository! 🎉 Thanks for your first pull request! We'll review this as soon as possible."
