name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Welcome to the project! Thank you for opening your first issue. Our maintainers will review it shortly. In the meantime, please check if your issue has already been reported."
        pr-message: "Welcome to the project! Thank you for your first pull request. We really appreciate your contribution. One of our maintainers will review your changes as soon as possible. Please make sure you have followed the contribution guidelines."
