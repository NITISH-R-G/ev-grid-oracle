name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Welcome to the repository! We are glad to have you here. Please check our contributing guidelines."
        pr-message: "Thank you for your first pull request! A maintainer will review it shortly. In the meantime, ensure all CI checks pass."
