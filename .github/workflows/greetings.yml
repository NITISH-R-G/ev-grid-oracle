name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome to the project! Thank you for opening your first issue. Our maintainers will look into it shortly."
          pr-message: "Welcome to the project! Thank you for submitting your first pull request. We appreciate your contribution."
