name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: 'Welcome to EV Grid Oracle! Thank you for raising your first issue. A maintainer will review it shortly.'
        pr-message: 'Welcome to EV Grid Oracle! Thank you for your first pull request. We will review it as soon as possible. Please make sure you have read the CONTRIBUTING.md guide.'
