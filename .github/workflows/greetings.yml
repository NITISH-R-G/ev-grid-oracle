name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Welcome to the repository! We appreciate your issue. A maintainer or our AI agent will take a look shortly."
        pr-message: "Welcome and thank you for your pull request! We run an autonomous AI agent to review PRs, which will provide feedback shortly."
