name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Welcome to the project! Thank you for opening your first issue.
            Our team will review it shortly. In the meantime, please ensure you've provided all necessary details.
          pr-message: |
            Welcome to the project! Thank you for opening your first pull request.
            Please make sure you have read our `CONTRIBUTING.md` and that your code passes `./validate-submission.sh`.
