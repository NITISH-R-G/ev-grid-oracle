name: Greetings

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: 'Welcome! Thank you for opening your first issue in this repository. A maintainer will triage it shortly.'
        pr-message: 'Welcome! Thank you for opening your first PR in this repository. We will review it as soon as possible.'
