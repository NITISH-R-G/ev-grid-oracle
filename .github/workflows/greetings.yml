name: Greetings

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: 'Welcome to the project! Thank you for opening your first issue. Our AI maintainer will review it shortly. In the meantime, please ensure you have provided all necessary details.'
        pr-message: 'Welcome to the project! Thank you for your first pull request. Our automated checks and AI maintainer will review your code shortly. Please make sure to read the contribution guidelines.'
