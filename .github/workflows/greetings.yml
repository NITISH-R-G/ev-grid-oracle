name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Welcome to EV Grid Oracle! Thank you for opening your first issue. A maintainer will review it shortly. In the meantime, please ensure you have provided all necessary details."
        pr-message: "Welcome and thank you for your first pull request! We're thrilled to have you contribute. The CI checks will run automatically, and an AI reviewer will provide insights shortly."
