name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Welcome to the project! Thank you for opening your first issue.
            We will review it and get back to you as soon as possible.
          pr-message: |
            Welcome to the project! Thank you for opening your first pull request.
            Our AI review system and maintainers will take a look at it soon.
