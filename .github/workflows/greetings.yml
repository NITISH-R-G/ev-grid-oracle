name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: 'Welcome to EV Grid Oracle! Thank you for raising your first issue. We appreciate your contribution to our community.'
          pr-message: 'Welcome to EV Grid Oracle! Thank you for your first pull request. One of our maintainers will review it shortly. In the meantime, please ensure you have read our contributing guidelines and run local validation scripts.'
