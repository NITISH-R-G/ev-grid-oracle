name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: 'Welcome to EV Grid Oracle! :wave: Thank you for taking the time to create an issue. A maintainer will check it out shortly. In the meantime, please make sure you have provided all the necessary information requested in the issue template.'
        pr-message: 'Welcome to EV Grid Oracle! :wave: Thank you for contributing. A maintainer will review your pull request soon. Have you checked out our [Contributing Guidelines](CONTRIBUTING.md)?'
