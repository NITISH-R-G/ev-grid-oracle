name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Welcome to EV Grid Oracle! Thank you for opening your first issue. Our team will review it shortly. In the meantime, please ensure you have provided all the necessary details."
        pr-message: "Welcome to EV Grid Oracle! Thank you for your first pull request. We appreciate your contribution. A maintainer will review your changes soon."
