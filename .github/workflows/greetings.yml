name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: 'Welcome to the project! Thank you for opening your first issue. Our AI and maintainers will look into it shortly.'
          pr-message: 'Welcome and thank you for your first pull request! We appreciate your contribution. Automated reviews and checks will begin now.'
