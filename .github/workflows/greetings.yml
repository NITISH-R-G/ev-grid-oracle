name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const isPR = !!context.payload.pull_request;
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const creator = context.payload.sender.login;

            // Welcome message logic
            const message = `Welcome @${creator}! Thank you for your contribution to the project. A maintainer will review your ${isPR ? 'pull request' : 'issue'} shortly. Please ensure you have read our CONTRIBUTING.md guidelines.`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: message
            });
