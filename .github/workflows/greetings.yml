name: Greetings

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome to EV Grid Oracle! Thank you for opening your first issue. A maintainer or our AI agent will assist you shortly."
          pr-message: "Welcome to EV Grid Oracle! Thank you for your first pull request. Our automated systems will review your code shortly."
