name: Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome to the repository! We are thrilled to have you here. Please make sure to check out our [Contributing Guidelines](CONTRIBUTING.md) and [Code of Conduct](CODE_OF_CONDUCT.md). We'll triage your issue shortly."
          pr-message: "Thank you for your first pull request! A maintainer will review your changes soon. Please ensure your code passes local validations by running `./validate-submission.sh`."
