name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome to the project! Thanks for opening your first issue here. If you are new to the project, please take a look at our contributing guidelines."
          pr-message: "Welcome to the project! Thanks for opening your first pull request. A maintainer will review your changes shortly. Please ensure all tests pass and your code is formatted properly."
