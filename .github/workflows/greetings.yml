name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome to OpenEnv! Thank you for opening your first issue. A maintainer will check it out shortly."
          pr-message: "Welcome to OpenEnv! Thank you for your first pull request. We will review it as soon as possible."
