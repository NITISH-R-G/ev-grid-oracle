name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Welcome! Thank you for opening your first issue. A maintainer or our AI agent will review it shortly."
        pr-message: "Welcome! Thank you for your first pull request. Please ensure you have read the contributing guidelines. Our automated CI and AI reviewer will check your PR shortly."
