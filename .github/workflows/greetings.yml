name: Greetings
on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Welcome to the EV Grid Oracle repository! :wave:

            Thank you for opening your first issue. We're glad you're here.
            Our team will take a look at it as soon as possible.
            In the meantime, feel free to check out our [CONTRIBUTING.md](CONTRIBUTING.md) guide.
          pr-message: |
            Welcome to the EV Grid Oracle repository! :tada:

            Thank you for your first pull request. We greatly appreciate your contribution.
            Please ensure you have read our [CONTRIBUTING.md](CONTRIBUTING.md) guide and that all checks pass.
            A maintainer will review your PR soon.
