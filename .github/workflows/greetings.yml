name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Welcome! Thank you for opening your first issue in this project.
            We appreciate your feedback and contributions.
            A maintainer will review your issue shortly. In the meantime, please ensure you have provided all necessary details according to our issue templates.
          pr-message: |
            Welcome! Thank you for creating your first pull request.
            We are excited to have you contribute to this project.
            Please ensure you have read our `CONTRIBUTING.md` guide and that your PR follows our guidelines, including passing all tests and code quality checks.
            A maintainer will review your PR soon.
