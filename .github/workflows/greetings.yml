name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Welcome! Thank you for opening your first issue in this project. A maintainer will triage this shortly."
        pr-message: "Welcome! Thank you for submitting your first pull request. Please make sure you have followed the contributing guidelines."
