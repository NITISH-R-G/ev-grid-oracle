name: Greetings

on: [pull_request, issues]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: 'Welcome to the EV Grid Oracle repository! Thank you for opening your first issue. We will review it shortly.'
        pr-message: 'Welcome to the EV Grid Oracle repository! Thank you for opening your first pull request. Please make sure you have followed the guidelines in CONTRIBUTING.md.'
