name: Contributor Welcome Greetings

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Welcome to the EV Grid Oracle repository! 👋
            Thank you for opening your first issue. Our AI and human maintainers will review it shortly. Please ensure you've provided all relevant details, logs, and a minimal reproducible example if reporting a bug.
          pr-message: |
            Welcome to the EV Grid Oracle repository! 🎉
            Thank you for submitting your first pull request.
            Before we merge, please ensure you've run `./validate-submission.sh` locally to check formatting, linting, and tests.
            An autonomous review will begin shortly!
