name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome to the project! Thank you for opening your first issue. A maintainer will be with you shortly."
          pr-message: "Welcome to the project! Thank you for submitting your first pull request. Please ensure all CI checks pass and someone will review your code soon."
