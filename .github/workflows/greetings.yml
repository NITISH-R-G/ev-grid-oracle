name: Welcome New Contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Welcome to the repository! We're glad you're here.
            Please make sure you've read our contributing guidelines.
            A maintainer will review your issue shortly.
          pr-message: |
            Welcome to the repository! We appreciate your first pull request.
            Please ensure you have read our contributing guidelines and our tests pass.
            Our AI PR agent will provide initial feedback, and a maintainer will review it soon.
