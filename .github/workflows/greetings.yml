name: Welcome First-Time Contributors
on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const creator = context.payload.sender.login;

            // Check if this is their first interaction
            const isFirstInteraction = async () => {
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                creator: creator,
                state: 'all'
              });

              if (issues.length > 1) return false;

              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all'
              });

              const userPulls = pulls.filter(pr => pr.user.login === creator);
              return userPulls.length <= 1;
            };

            if (await isFirstInteraction()) {
              const type = context.eventName === 'issues' ? 'issue' : 'pull request';
              const message = `Welcome to the repository, @${creator}! 🎉\n\nThank you for creating your first ${type}. We appreciate your contribution! Please make sure to check out our [CONTRIBUTING.md](CONTRIBUTING.md) and [CODE_OF_CONDUCT.md](CODE_OF_CONDUCT.md) files. A maintainer will review your ${type} shortly.`;

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message
              });
            }
