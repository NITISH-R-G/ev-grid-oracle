name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: 'Welcome to the EV Grid Oracle repository! Thank you for opening your first issue. Our team will review it shortly. In the meantime, please ensure you have provided all the necessary details as requested in the issue template.'
          pr-message: 'Welcome to the EV Grid Oracle repository! Thank you for submitting your first pull request. We appreciate your contribution. Our AI and human maintainers will review your changes soon. Please make sure your PR follows our contributing guidelines and passes all checks.'
