name: Welcome New Contributors

on:
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const creator = context.payload.pull_request.user.login;
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const pr_number = context.payload.pull_request.number;

            const response = await github.rest.search.issuesAndPullRequests({
              q: `is:pr author:${creator} repo:${owner}/${repo}`
            });

            if (response.data.total_count === 1) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr_number,
                body: `Welcome, @${creator}! 🎉\n\nThank you for making your first pull request to EV Grid Oracle! We really appreciate your contribution. \n\nA maintainer or the AI Review agent will review your changes shortly. In the meantime, please ensure your code adheres to our [Contributing Guidelines](CONTRIBUTING.md) and passes all CI checks.`
              });
            }
