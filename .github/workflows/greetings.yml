name: Greetings

on: [pull_request, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: 'Welcome to the project! Thank you for opening your first issue. A maintainer will review it shortly.'
        pr-message: 'Welcome and thank you for your first pull request! We truly appreciate your contribution. The CI pipelines will run shortly and an AI review will be provided.'
