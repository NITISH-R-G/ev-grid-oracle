name: Autofix Repository

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install ruff

      - name: Run Ruff Format
        run: ruff format --exclude ".github" . || true

      - name: Run Ruff Check (Fix)
        run: ruff check --fix --exclude ".github" . || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prettier Format
        run: npx prettier --ignore-path .prettierignore --write . || true

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: apply automated fixes (ruff & prettier)"
          branch: ${{ github.head_ref || github.ref }}
