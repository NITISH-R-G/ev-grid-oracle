name: autofix.ci
on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install ruff pre-commit nodeenv

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install prettier
        run: npm install -g prettier

      - name: Run Ruff Check & Format
        run: |
          ruff check --fix . || true
          ruff format . || true

      - name: Run Prettier
        run: |
          npx prettier --write "**/*.{js,ts,jsx,tsx,json,md,yml,yaml}" || true

      - uses: autofix-ci/action@dd55f44df8f7cdb7a6bf74c78677eb8acd40cd0a
