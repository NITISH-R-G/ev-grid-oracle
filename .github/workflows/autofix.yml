name: Autofix

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.event.sender.type != 'Bot' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Run Ruff and Prettier
        run: |
          uv run --with ruff ruff check --fix . || true
          uv run --with ruff ruff format . || true
          npm install -g prettier
          npx prettier --write "**/*.{json,md,yml,yaml,ts,js,html,css}" || true

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Auto-fix formatting and linting issues"
