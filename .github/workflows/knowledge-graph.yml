name: Knowledge Graph Sync

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'ev_grid_oracle/**'
      - 'server/**'

jobs:
  generate-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz
          pip install pydeps
          pip install -e ".[dev,demo]"

      - name: Generate Knowledge Graph
        run: |
          mkdir -p docs/knowledge_graph
          pydeps ev_grid_oracle --max-bacon=2 -o docs/knowledge_graph/ev_grid_oracle_deps.svg
          pydeps server --max-bacon=2 -o docs/knowledge_graph/server_deps.svg

      - name: Commit graph changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-generate knowledge graph"
          file_pattern: 'docs/knowledge_graph/**'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
