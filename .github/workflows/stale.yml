name: Close Stale Issues

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue is stale because it has been open for 30 days with no activity. Remove the stale label or add a comment to keep it open.'
          stale-pr-message: 'This pull request is stale because it has been open for 30 days with no activity. Remove the stale label or add a comment to keep it open.'
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'bug,pinned,security,help wanted'
