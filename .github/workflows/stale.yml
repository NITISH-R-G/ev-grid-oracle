name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue is stale because it has been open for 30 days with no activity. Remove the stale label or comment or this will be closed in 7 days.'
          stale-pr-message: 'This pull request is stale because it has been open for 30 days with no activity. Remove the stale label or comment or this will be closed in 7 days.'
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'bug,enhancement,security,pinned'
