name: Manage Stale Issues and PRs

on:
  schedule:
    - cron: "0 2 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: "This issue is stale because it has been open for 30 days with no activity. Remove the stale label or comment, otherwise this will be closed in 7 days."
          stale-pr-message: "This PR is stale because it has been open for 30 days with no activity. Remove the stale label or comment, otherwise this will be closed in 7 days."
          days-before-stale: 30
          days-before-close: 7
          operations-per-run: 50
