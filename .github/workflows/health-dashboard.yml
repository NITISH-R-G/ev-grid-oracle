name: Repository Health Dashboard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for git stats

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev,demo]"

      - name: Generate Health Dashboard
        run: |
          python tools/generate_health_dashboard.py

      - name: Upload Dashboard Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dashboard_output/
