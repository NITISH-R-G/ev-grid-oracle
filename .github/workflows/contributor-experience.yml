name: Contributor Experience Automation

on:
  pull_request_target:
    types: [opened, ready_for_review]
  issues:
    types: [opened]

jobs:
  welcome-first-time-contributor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Welcome to our repository! 🎉 We're excited to have you here.

            Before you get started, please make sure you've read our [Contributing Guidelines](CONTRIBUTING.md) and [Code of Conduct](CODE_OF_CONDUCT.md).

            If you need help, feel free to ask here. A maintainer will triage this issue shortly.
          pr-message: |
            Congratulations on your first pull request! 🎉

            Thank you for taking the time to contribute to our project.
            Our automated CI systems will now run tests on your code. An AI agent might also provide some initial feedback.

            Please ensure you have run `./validate-submission.sh` locally.

  label-pr-based-on-paths:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true
