name: Auto-generate Documentation
on:
  push:
    branches: [ main ]
    paths:
      - 'ev_grid_oracle/**/*.py'
      - 'server/**/*.py'

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Generate pdoc
        run: |
          mkdir -p docs/api
          uv run --with pdoc pdoc --html --output-dir docs/api ev_grid_oracle server
      - name: Commit docs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-generate pdoc documentation"
