name: Autonomous Documentation Sync

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - '**.py'
      - '**.md'

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install documentation tools
        run: |
          pip install pdoc mkdocs mkdocs-material

      - name: Install project dependencies
        run: |
          pip install uv
          uv pip install --system -e ".[dev,demo]" || true

      - name: Generate API Documentation
        run: |
          mkdir -p docs/api
          # Find all python packages in the repo and generate docs for them
          PACKAGES=$(find . -maxdepth 2 -name "__init__.py" -exec dirname {} \; | grep -v "\.venv" | grep -v "tests" | awk -F'/' '{print $2}' | sort | uniq)
          for pkg in $PACKAGES; do
            if [ -d "$pkg" ]; then
              pdoc --docformat google -o docs/api/$pkg ./$pkg || true
            fi
          done

      - name: Deploy Docs
        # Only deploy on main branch, not on PRs
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: docs
