name: Code Quality Automation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0' # Weekly

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy pydantic vulture radon
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi

    - name: Lint and Format with Ruff
      run: |
        ruff check . --output-format=github
        ruff format --check .

    - name: Type checking with Mypy
      run: |
        mypy .

    - name: Dead Code Detection with Vulture
      run: |
        vulture . --min-confidence 80 --exclude .venv,venv,.cursor,web/node_modules

    - name: Complexity Analysis with Radon
      run: |
        radon cc . -a -nc
        radon mi . -nc

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npx tsc --noEmit

    - name: Lint and Format
      run: |
        npx prettier --check .

  duplicate-code:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install jscpd
      run: npm install -g jscpd

    - name: Check for duplicate code
      run: jscpd . --ignore "**/*.json,**/*.md,**/*.yaml,**/*.yml,**/package-lock.json,**/node_modules/**,**/venv/**,**/.venv/**,**/build/**,build/**" --threshold 25
