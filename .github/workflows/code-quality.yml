name: Code Quality Automation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0' # Weekly

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Pull Git LFS objects
      run: git lfs pull || true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy pydantic vulture radon
        pip install -e ".[dev,demo]"

    - name: Lint and Format with Ruff
      run: |
        ruff check . || true
        ruff format --check . || true

    - name: Type checking with Mypy
      run: |
        mypy . || true

    - name: Dead Code Detection with Vulture
      run: |
        vulture . --min-confidence 80 --exclude .venv,venv,.cursor,web/node_modules || true

    - name: Complexity Analysis with Radon
      run: |
        radon cc . -a -nc || true
        radon mi . -nc || true

    - name: Pytest validation
      run: |
        python -m pytest tests/ -q --tb=line || true

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: 'npm'
        cache-dependency-path: ./web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npx tsc --noEmit || true

    - name: Format
      run: |
        npx prettier --check . || true

  duplicate-code:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Install jscpd
      run: npm install -g jscpd

    - name: Check for duplicate code
      run: jscpd . --ignore "**/*.json,**/*.md,**/*.yaml,**/*.yml,**/package-lock.json,**/node_modules/**,**/venv/**,**/.venv/**" --threshold 5 || true
