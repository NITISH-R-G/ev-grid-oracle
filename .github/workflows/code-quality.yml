name: Code Quality Automation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0' # Weekly

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Pull Git LFS objects
      run: git lfs pull

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy pydantic vulture radon
        pip install -e ".[dev,demo]"

    - name: Lint and Format with Ruff
      run: |
        ruff check . --output-format=github
        ruff format --check .

    - name: Type checking with Mypy
      run: |
        mypy .

    - name: Dead Code Detection with Vulture
      run: |
        vulture . --min-confidence 80 --exclude .venv,venv,.cursor,web/node_modules

    - name: Complexity Analysis with Radon
      run: |
        radon cc . -a -nc
        radon mi . -nc

    - name: Pytest validation
      run: |
        python -m pytest tests/ -q --tb=line

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: ./web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npx tsc --noEmit

    - name: Format
      run: |
        npx prettier --check .

  duplicate-code:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install jscpd
      run: npm install -g jscpd

    - name: Check for duplicate code
      run: jscpd . --ignore "**/*.json,**/*.md,**/*.yaml,**/*.yml,**/package-lock.json,**/node_modules/**,**/venv/**,**/.venv/**,**/test_*.py,tests/**,tools/**,server/ev_grid_road_environment.py,server/ev_grid_environment.py,server/road_router.py,server/role_metrics.py,viz/city_map.py,training/make_plots.py,ev_grid_oracle/city_graph.py" --threshold 5
