name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: ${{ github.event.sender.type != 'Bot' }}
    steps:
      - name: CodeRabbit AI Code Review
        uses: coderabbitai/coderabbit-pr-review@v1.17.0
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
