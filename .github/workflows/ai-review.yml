name: AI PR Agent Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  coderabbit:
    runs-on: ubuntu-latest
    steps:
      - name: CodeRabbit AI PR Review
        uses: coderabbitai/coderabbit-pr-review@v1.20.1
