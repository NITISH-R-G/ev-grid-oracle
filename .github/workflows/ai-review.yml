name: CodeRabbit AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    if: ${{ github.event.sender.type != 'Bot' && (github.event_name == 'pull_request' || github.event.issue.pull_request) }}
    steps:
      - name: Run CodeRabbit PR Review
        uses: coderabbitai/coderabbit-pr-review@v1
        with:
          # Optional configurations can be added here
          # https://github.com/coderabbitai/coderabbit-pr-review
          review-on-push: true
