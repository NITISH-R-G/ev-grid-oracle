name: Architecture Diagrams

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system pylint
          uv pip install --system -e ".[dev]"

      - name: Generate Architecture Diagrams
        run: |
          mkdir -p docs/architecture
          pyreverse -o png -p ev_grid_oracle ev_grid_oracle/ -d docs/architecture || true
          pyreverse -o png -p server server/ -d docs/architecture || true

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: Auto-update architecture diagrams [skip ci]"
