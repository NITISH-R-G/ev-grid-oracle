name: Architecture Diagrams

on:
  push:
    branches:
      - main
    paths:
      - 'ev_grid_oracle/**'
      - 'server/**'

permissions:
  contents: write

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install Dependencies
        run: |
          pip install pylint uv
          uv pip install --system -e ".[dev,demo]"

      - name: Generate Diagrams
        run: |
          mkdir -p docs/architecture
          pyreverse -o png -p EVGridOracle ev_grid_oracle/ server/ -d docs/architecture/

      - name: Commit Diagrams
        uses: stefanzweifel/git-auto-commit-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: "docs(architecture): auto-generate UML diagrams"
          branch: main
          file_pattern: 'docs/architecture/*.png'
