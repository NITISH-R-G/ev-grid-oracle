name: Auto Triage Issues
on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issueTitle = context.payload.issue.title.toLowerCase();
            const issueBody = (context.payload.issue.body || '').toLowerCase();
            const labelsToAdd = [];

            if (issueTitle.includes('[bug]') || issueBody.includes('bug') || issueBody.includes('error') || issueBody.includes('exception')) {
              labelsToAdd.push('bug');
            }
            if (issueTitle.includes('[feature]') || issueBody.includes('feature') || issueBody.includes('enhancement')) {
              labelsToAdd.push('enhancement');
            }
            if (issueTitle.includes('[doc]') || issueBody.includes('documentation') || issueBody.includes('readme')) {
              labelsToAdd.push('documentation');
            }
            if (labelsToAdd.length === 0) {
              labelsToAdd.push('triage');
            }

            // Fetch existing labels
            const currentLabels = context.payload.issue.labels.map(l => l.name);
            const newLabels = labelsToAdd.filter(l => !currentLabels.includes(l));

            if (newLabels.length > 0) {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: newLabels
              });
            }
