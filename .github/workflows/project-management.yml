name: Project Management

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, labeled]

permissions:
  issues: write
  pull-requests: write

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const pr = context.payload.pull_request;
            const labels = issue ? issue.labels : (pr ? pr.labels : []);

            if (!labels) return;

            const hasBug = labels.some(l => l.name === 'bug');
            const hasEnhancement = labels.some(l => l.name === 'enhancement');

            if (hasBug || hasEnhancement) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue ? issue.number : pr.number,
                assignees: ['NITISH-R-G']
              });
            }
