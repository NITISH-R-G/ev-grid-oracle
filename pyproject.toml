[project]
name = "ev-grid-oracle"
version = "0.0.1"
description = "EV Grid Oracle (OpenEnv Hackathon + BESCOM Theme 9)"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "networkx>=3.2",
  "openenv-core>=0.2.3",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "matplotlib>=3.8",
  "tensorboard>=2.14",
  "pytest-cov>=4.0",
  "radon>=6.0",
  "bandit>=1.7",
  "pydeps>=3.0",
  "cyclonedx-bom>=5.0",
  "jinja2>=3.1",
]
demo = [
  "gradio>=4.44",
  "pillow>=10.3",
  "matplotlib>=3.8",
  "pygame-ce>=2.5.2",
  "transformers>=4.45",
  "peft>=0.13",
  "safetensors>=0.4",
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ev_grid_oracle", "server"]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", ".cursor"]
